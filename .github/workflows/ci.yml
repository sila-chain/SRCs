name: Continuous Integration

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - edited
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  save-pr:
    name: Save PR Number
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Save PR number
        env:
          PR_NUMBER: ${{ github.event.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          mkdir -p ./pr
          echo $PR_NUMBER > ./pr/pr_number
          echo $PR_SHA > ./pr/pr_sha
          echo $MERGE_SHA > ./pr/merge_sha

      - name: Upload PR Number
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: pr_number
          path: pr/

  htmlproofer:
    name: HTMLProofer
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout SIPs
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: sila-chain/SIPs
          path: ''
          fetch-depth: 0

      - name: Restore SIPs mtimes from git history
        uses: chetan/git-restore-mtime-action@d186aca54f8760da4dec55313195e51ed3ebb0b3 # v2.3

      - name: Get SIPs Version
        id: sips
        run: echo "sha=$(git rev-parse --short=8 HEAD)" >> $GITHUB_OUTPUT

      - name: Checkout SRCs
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: sila-chain/SRCs
          path: SRCs
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Restore SRCs mtimes from git history
        uses: chetan/git-restore-mtime-action@d186aca54f8760da4dec55313195e51ed3ebb0b3 # v2.3
        with:
          working-directory: SRCs

      - name: Get Changed Files
        id: changed
        continue-on-error: true
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "mode=full" >> $GITHUB_OUTPUT
            exit 0
          fi

          ALL_CHANGED=$(gh pr diff ${{ github.event.number }} --name-only --repo ${{ github.repository }})
          NON_SRC=$(echo "$ALL_CHANGED" | grep -v -E '^SRCS/src-[0-9]+\.md$' | grep -v '^\s*$' || true)
          if [ -n "$NON_SRC" ]; then
            echo "Non-SRC files changed, will run full check"
            echo "mode=full" >> $GITHUB_OUTPUT
            exit 0
          fi
          CHANGED_NUMS=$(echo "$ALL_CHANGED" | grep -oE 'src-[0-9]+' | sed 's/src-//' | sort -u | tr '\n' ' ')
          if [ -z "$CHANGED_NUMS" ]; then
            echo "mode=full" >> $GITHUB_OUTPUT
          else
            echo "mode=incremental" >> $GITHUB_OUTPUT
            echo "nums=${CHANGED_NUMS}" >> $GITHUB_OUTPUT
            echo "Will check only changed SRCs: ${CHANGED_NUMS}"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge Repos
        run: |
          mkdir -p $GITHUB_WORKSPACE/SRCs/SRCS
          mkdir -p $GITHUB_WORKSPACE/SRCs/SIPS
          cp -rp $GITHUB_WORKSPACE/SRCs/SRCS/. $GITHUB_WORKSPACE/SIPS
          cp -rp $GITHUB_WORKSPACE/SRCs/SIPS/. $GITHUB_WORKSPACE/SIPS
          cp -rp $GITHUB_WORKSPACE/SRCs/assets/. $GITHUB_WORKSPACE/assets
          cp -rp $GITHUB_WORKSPACE/SRCs/_layouts/. $GITHUB_WORKSPACE/_layouts 2>/dev/null || true
          cd $GITHUB_WORKSPACE/SIPS
          find . -name "src-*.md" -type f -exec sh -c 'echo mv "$1" "$(echo "$1" | sed s/src/sip/)"' _ {} \; | sh
          cd $GITHUB_WORKSPACE/assets
          find . -name "src-*" -type d -exec sh -c 'echo mv "$1" "$(echo "$1" | sed s/src/sip/)"' _ {} \; | sh
          cd $GITHUB_WORKSPACE
          rm -rf SRCs

      - name: Setup Ruby
        uses: ruby/setup-ruby@fb404b9557c186e349162b0d8efb06e2bc36edea # v1.232.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0

      - name: Restore Jekyll Cache
        id: cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            _site
            .jekyll-metadata
          key: jekyll-${{ runner.os }}-sips-${{ steps.sips.outputs.sha }}
          restore-keys: |
            jekyll-${{ runner.os }}-

      - name: Build Website
        run: |
          bundle exec jekyll doctor
          echo "::notice::Jekyll incremental build (mode=${{ steps.changed.outputs.mode }})"
          bundle exec jekyll build --incremental

      - name: HTML Proofer
        run: |
          if [ "${{ steps.changed.outputs.mode }}" = "incremental" ]; then
            PATHS=()
            for num in ${{ steps.changed.outputs.nums }}; do
              slug="sip-${num}"
              if [ -d "./_site/SIPS/${slug}" ]; then
                PATHS+=("./_site/SIPS/${slug}")
              elif [ -f "./_site/SIPS/${slug}.html" ]; then
                PATHS+=("./_site/SIPS/${slug}.html")
              elif [ -d "./_site/${slug}" ]; then
                PATHS+=("./_site/${slug}")
              elif [ -f "./_site/${slug}.html" ]; then
                PATHS+=("./_site/${slug}.html")
              fi
            done
            if [ ${#PATHS[@]} -gt 0 ]; then
              printf -v PATHS_NOTICE ' %q' "${PATHS[@]}"
              echo "::notice::Running HTMLProofer on changed files only:${PATHS_NOTICE}"
              bundle exec htmlproofer --root-dir ./_site --allow-missing-href --disable-external --assume-extension '.html' --log-level=:info --cache='{"timeframe":{"external":"6w"}}' --checks 'Links,Images,Scripts,OpenGraph' --no-check-sri --ignore-empty-alt --no-enforce_https "${PATHS[@]}"
              exit $?
            fi
            echo "::warning::Changed SRC HTML files not found in build output, falling back to full check"
          fi
          bundle exec htmlproofer --allow-missing-href --disable-external --assume-extension '.html' --log-level=:info --cache='{"timeframe":{"external":"6w"}}' --checks 'Links,Images,Scripts,OpenGraph' --no-check-sri --ignore-empty-alt --no-enforce_https ./_site

      - name: DNS Validator
        shell: bash
        run: |
          set -euo pipefail
          DOMAIN='sips.sila.org'
          if getent ahosts "$DOMAIN" >/dev/null 2>&1; then
            echo "CUSTOM_DOMAIN_DNS_STATUS=RESOLVING"
            bundle exec github-pages health-check
            echo "CUSTOM_DOMAIN_DNS_GATE=PASS"
          else
            echo "CUSTOM_DOMAIN_DNS_STATUS=UNCONFIGURED"
            echo "CUSTOM_DOMAIN_DNS_GATE=DEFERRED_EXTERNAL_INFRASTRUCTURE"
            echo "Custom-domain DNS is not a repository-content PR gate until the external DNS record exists."
          fi

      - name: Save Jekyll Cache
        if: always()
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            _site
            .jekyll-metadata
          key: jekyll-${{ runner.os }}-sips-${{ steps.sips.outputs.sha }}

  link-check:
    name: Link Check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout SIP Repository
        uses: actions/checkout@47fbe2df0ad0e27efb67a70beac3555f192b062f

      - name: Link Checker
        uses: gaurav-nelson/github-action-markdown-link-check@d53a906aa6b22b8979d33bc86170567e619495ec
        with:
          config-file: config/mlc_config.json
          use-quiet-mode: no
          use-verbose-mode: yes
          check-modified-files-only: yes

  codespell:
    name: CodeSpell
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout SIP Repository
        uses: actions/checkout@47fbe2df0ad0e27efb67a70beac3555f192b062f

      - name: Get Changed Files
        id: changed
        continue-on-error: true
        run: |
          echo "CHANGED_FILES<<EOF" >> $GITHUB_ENV
          gh pr diff ${{ github.event.number }} --name-only | sed -e 's|$|,|' | xargs -i echo "{}" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run CodeSpell
        uses: codespell-project/actions-codespell@57beb9f38f49d773d641ac555d1565c3b6a59938
        if: steps.changed.outcome == 'success'
        with:
          check_filenames: true
          ignore_words_file: config/.codespell-whitelist
          path: ${{ env.CHANGED_FILES }}
          skip: .git,Gemfile.lock,**/*.png,**/*.gif,**/*.jpg,**/*.svg,.codespell-whitelist,vendor,_site,_config.yml,style.css

  sipw-validator:
    name: SIP Walidator
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout SIP Repository
        uses: actions/checkout@47fbe2df0ad0e27efb67a70beac3555f192b062f

      - uses: sila-chain/sipw-action@05fc431795f375307ffe2be35f62d967ea69b8c3
        id: sipw
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          unchecked: 1
          path: SRCS/
          options-file: config/sipw.toml

  markdownlint:
    name: Markdown Linter
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SIP Repository
        uses: actions/checkout@47fbe2df0ad0e27efb67a70beac3555f192b062f

      - name: Get Changed Files
        id: changed
        continue-on-error: true
        run: |
          echo "CHANGED_FILES<<EOF" >> $GITHUB_ENV
          gh pr diff ${{ github.event.number }} --name-only | grep -E -x '[^/]+\.md|SIPS/sip-[0-9]+\.md' >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint
        uses: DavidAnson/markdownlint-cli2-action@f5cf187ef11bd3a68a127321b794aa252ff23019
        if: steps.changed.outcome == 'success'
        with:
          command: config
          globs: |
            config/.markdownlint.yaml
            ${{ env.CHANGED_FILES }}
