name: SRCs Import Tracked Ignored Authority

on:
  push:
    branches:
      - sila/srcs-latest-pure-20260907

permissions:
  contents: write

jobs:
  import-tracked-ignored:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout SRCs candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Generate and force-add exact tracked ignored files
        shell: bash
        run: |
          set -euo pipefail
          UPSTREAM_SHA='f4c23717b6a6fc48436bb6778dcecce29cc5345c'
          BRANCH='sila/srcs-latest-pure-20260907'
          SOURCE='https://github.com/ethereum/ERCs.git'
          test "$(git branch --show-current)" = "$BRANCH"
          test -f .sila/srcs_regenerate_v1.py
          test -f .sila/srcs_regenerate_v2.py

          LIVE_UPSTREAM="$(git ls-remote "$SOURCE" refs/heads/master | awk '{print $1}')"
          echo "LIVE_UPSTREAM=$LIVE_UPSTREAM"
          test "$LIVE_UPSTREAM" = "$UPSTREAM_SHA"

          rm -rf /tmp/src-source /tmp/src-expected
          git clone --quiet "$SOURCE" /tmp/src-source
          git -C /tmp/src-source checkout --quiet --detach "$UPSTREAM_SHA"
          python3 .sila/srcs_regenerate_v2.py /tmp/src-source /tmp/src-expected

          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          expected_root = Path('/tmp/src-expected/assets/src-7738/.openzeppelin')
          if not expected_root.is_dir():
              raise SystemExit('EXPECTED_OPENZEPPELIN_DIRECTORY_MISSING')
          expected = sorted(p.name for p in expected_root.glob('*.json') if p.is_file())
          required = sorted([
              'base-sepolia.json',
              'base.json',
              'holesky.json',
              'polygon.json',
              'sepolia.json',
              'sila-mainnet.json',
              'unknown-1001.json',
              'unknown-5003.json',
              'unknown-80002.json',
              'unknown-8217.json',
          ])
          print(f'EXPECTED_TRACKED_IGNORED_COUNT={len(expected)}')
          if expected != required:
              print('EXPECTED=' + ','.join(expected))
              print('REQUIRED=' + ','.join(required))
              raise SystemExit('TRACKED_IGNORED_AUTHORITY_SET_MISMATCH')

          upstream_tracked = subprocess.run(
              ['git','-C','/tmp/src-source','ls-files','assets/erc-7738/.openzeppelin/*.json'],
              check=True,text=True,stdout=subprocess.PIPE
          ).stdout.splitlines()
          print(f'UPSTREAM_TRACKED_OPENZEPPELIN_COUNT={len(upstream_tracked)}')
          if len(upstream_tracked) != 10:
              print('\n'.join(upstream_tracked))
              raise SystemExit('UPSTREAM_TRACKED_OPENZEPPELIN_COUNT_MISMATCH')
          print('TRACKED_IGNORED_AUTHORITY_SET_GATE=PASS')
          PY

          mkdir -p assets/src-7738/.openzeppelin
          cp -a /tmp/src-expected/assets/src-7738/.openzeppelin/*.json assets/src-7738/.openzeppelin/

          git config user.name 'SILA Network'
          git config user.email 'sila-chain@users.noreply.github.com'
          git add -f assets/src-7738/.openzeppelin/*.json

          STAGED_COUNT="$(git diff --cached --name-only | wc -l | tr -d ' ')"
          echo "TRACKED_IGNORED_STAGED_COUNT=$STAGED_COUNT"
          test "$STAGED_COUNT" = '10'
          if git diff --cached --name-only | grep -v '^assets/src-7738/\.openzeppelin/.*\.json$'; then
            echo 'TRACKED_IGNORED_SCOPE_GATE=FAIL'
            false
          fi
          echo 'TRACKED_IGNORED_SCOPE_GATE=PASS'

          git commit -m 'sync: include tracked ignored SRC authority files'
          git push origin "HEAD:$BRANCH"
          echo 'TRACKED_IGNORED_IMPORT_GATE=PASS'
