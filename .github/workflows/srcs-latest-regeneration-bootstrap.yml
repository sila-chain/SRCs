name: SRCs Latest Pure Regeneration Bootstrap

on:
  push:
    branches:
      - sila/srcs-latest-pure-20260907

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout SRCs candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Regenerate from exact latest ERC authority
        shell: bash
        run: |
          set -euo pipefail
          UPSTREAM_SHA='f4c23717b6a6fc48436bb6778dcecce29cc5345c'
          BRANCH='sila/srcs-latest-pure-20260907'
          GENERATOR='.sila/srcs_regenerate_v2.py'

          echo "UPSTREAM_SHA=$UPSTREAM_SHA"
          echo "GENERATOR=$GENERATOR"
          test "$(git branch --show-current)" = "$BRANCH"
          test -f "$GENERATOR"
          test -f .sila/srcs_regenerate_v1.py
          python3 - <<'PY'
          from pathlib import Path
          for name in ('.sila/srcs_regenerate_v1.py', '.sila/srcs_regenerate_v2.py'):
              source = Path(name).read_text(encoding='utf-8')
              compile(source, name, 'exec')
              print(f'SYNTAX_GATE=PASS:{name}')
          PY
          test ! -d .sila/__pycache__

          LIVE_UPSTREAM="$(git ls-remote https://github.com/ethereum/ERCs.git refs/heads/master | awk '{print $1}')"
          echo "LIVE_UPSTREAM=$LIVE_UPSTREAM"
          test "$LIVE_UPSTREAM" = "$UPSTREAM_SHA"

          rm -rf /tmp/srcs-upstream /tmp/srcs-generated /tmp/srcs-policy
          mkdir -p /tmp/srcs-policy

          # Preserve all current workflow files byte-identically. The Actions token is not
          # allowed to create/update workflow files; workflow policy is mutated only through
          # the GitHub authority connector after regeneration succeeds.
          cp -a .github/workflows /tmp/srcs-policy/workflows
          cp -a .sila /tmp/srcs-policy/.sila
          for p in Gemfile Gemfile.lock _config.yml config; do
            if [ -e "$p" ]; then
              cp -a "$p" "/tmp/srcs-policy/$p"
            fi
          done

          git clone --quiet https://github.com/ethereum/ERCs.git /tmp/srcs-upstream
          git -C /tmp/srcs-upstream checkout --quiet --detach "$UPSTREAM_SHA"
          test "$(git -C /tmp/srcs-upstream rev-parse HEAD)" = "$UPSTREAM_SHA"

          python3 "$GENERATOR" /tmp/srcs-upstream /tmp/srcs-generated

          # Overlay verified Sila repository-policy/build authorities. Workflows remain
          # exactly equal to the branch input so the generated commit cannot mutate them.
          rm -rf /tmp/srcs-generated/.github/workflows
          mkdir -p /tmp/srcs-generated/.github
          cp -a /tmp/srcs-policy/workflows /tmp/srcs-generated/.github/workflows
          rm -rf /tmp/srcs-generated/.sila
          cp -a /tmp/srcs-policy/.sila /tmp/srcs-generated/.sila
          for p in Gemfile Gemfile.lock _config.yml config; do
            if [ -e "/tmp/srcs-policy/$p" ]; then
              rm -rf "/tmp/srcs-generated/$p"
              cp -a "/tmp/srcs-policy/$p" "/tmp/srcs-generated/$p"
            fi
          done

          find /tmp/srcs-generated/.sila -type d -name __pycache__ -prune -exec rm -rf {} +
          test ! -d /tmp/srcs-generated/.sila/__pycache__

          # Validate preserved policy text against known historical substring corruption.
          python3 - <<'PY'
          from pathlib import Path
          root = Path('/tmp/srcs-generated')
          tokens = ('wh'+'sila', 'soms'+'iling', 'togs'+'ila', 'tos'+'ilaer', 'nons'+'ileless')
          bad = []
          for base in (root/'.github', root/'.sila', root/'config'):
              if not base.exists():
                  continue
              for p in base.rglob('*'):
                  if not p.is_file():
                      continue
                  try:
                      text = p.read_text(encoding='utf-8')
                  except UnicodeDecodeError:
                      continue
                  for token in tokens:
                      if token in text:
                          bad.append(f'{p.relative_to(root)}:{token}')
          print(f'POLICY_CORRUPTION_RESIDUAL_COUNT={len(bad)}')
          if bad:
              print('\n'.join(bad[:200]))
              raise SystemExit(1)
          print('POLICY_CORRUPTION_GATE=PASS')
          PY

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/srcs-generated/. .

          test -f SRCS/src-7730.md
          test -f SRCS/src-2535.md
          test -f _includes/sipnums.html
          test -f _includes/siptable.html
          test -f rss/nonsrc.xml
          test -f rss/nonsrc-last-call.xml
          test -f assets/src-1967/Sample-proxy-on-silascan.png
          test -f .github/workflows/ci.yml
          test -f .github/workflows/jekyll.yml
          test -f .github/workflows/srcs-latest-regeneration-bootstrap.yml
          test -f .sila/srcs_regenerate_v1.py
          test -f .sila/srcs_regenerate_v2.py
          test ! -d .sila/__pycache__

          # Workflow tree must be byte-identical to the branch input.
          diff -qr /tmp/srcs-policy/workflows .github/workflows
          echo 'WORKFLOW_BYTE_IDENTITY_GATE=PASS'

          # Generated upstream may preserve upstream whitespace; check Sila-owned authorities.
          git diff --check -- .sila config _config.yml Gemfile Gemfile.lock

          git config user.name 'SILA Network'
          git config user.email 'sila-chain@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'REGENERATION_DIFF_COUNT=0'
          else
            if ! git diff --cached --quiet -- .github/workflows; then
              echo 'WORKFLOW_MUTATION_GATE=FAIL'
              git diff --cached --name-status -- .github/workflows
              false
            fi
            echo 'WORKFLOW_MUTATION_GATE=PASS'
            git commit -m 'sync: regenerate SRCs from latest pure Sila authority'
            git push origin "HEAD:$BRANCH"
          fi

          echo 'LATEST_REGENERATION_BOOTSTRAP_GATE=PASS'
