name: Final Warning Repair

on:
  push:
    branches:
      - sila/srcs-final-warning-cleanup-20260905

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Apply exact source repairs and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          url_repairs = {
              Path('README.md'): 1,
              Path('SRCS/src-1438.md'): 1,
              Path('SRCS/src-1620.md'): 3,
              Path('SRCS/src-1948.md'): 2,
          }
          bad = 'https://Sila Research/'
          good = 'https://ethresear.ch/'
          for path, expected in url_repairs.items():
              text = path.read_text()
              count = text.count(bad)
              print(f'URL_REPAIR_PRECOUNT {path}={count}')
              if count != expected:
                  raise SystemExit(f'UNEXPECTED_URL_REPAIR_COUNT:{path}:{count}:expected={expected}')
              path.write_text(text.replace(bad, good))

          path = Path('SRCS/src-7730.md')
          text = path.read_text()
          paragraph = 'To include literal curly braces in the intent text, escape them by doubling: `{{` for `{` and `}}` for `}`.'
          json_line = '    "interpolatedIntent": "Execute {{function}} with {amount} tokens"'
          if text.count(paragraph) != 1:
              raise SystemExit(f'UNEXPECTED_7730_PARAGRAPH_COUNT:{text.count(paragraph)}')
          if text.count(json_line) != 1:
              raise SystemExit(f'UNEXPECTED_7730_JSON_LINE_COUNT:{text.count(json_line)}')
          text = text.replace(paragraph, '{% raw %}\n' + paragraph + '\n{% endraw %}', 1)
          text = text.replace(json_line, '{% raw %}\n' + json_line + '\n{% endraw %}', 1)
          path.write_text(text)

          for p in url_repairs:
              if bad in p.read_text():
                  raise SystemExit(f'INVALID_RESEARCH_URL_REMAINS:{p}')
          if path.read_text().count('{% raw %}') != 2 or path.read_text().count('{% endraw %}') != 2:
              raise SystemExit('SRC_7730_RAW_GUARD_COUNT_MISMATCH')
          print('FINAL_SOURCE_REPAIR_GATE=PASS')
          PY

          git diff --check
          git rm .github/workflows/final-warning-diagnostic.yml
          git status --short
          git config user.name 'SILA Network'
          git config user.email 'pssd500@gmail.com'
          git add README.md SRCS/src-1438.md SRCS/src-1620.md SRCS/src-1948.md SRCS/src-7730.md
          git diff --cached --check
          git commit -m 'fix: repair historical research links and Liquid literals'
          git push origin HEAD:sila/srcs-final-warning-cleanup-20260905
