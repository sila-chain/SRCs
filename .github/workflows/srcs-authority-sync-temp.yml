name: SRCs Latest Authority Sync

on:
  push:
    branches:
      - sila/srcs-sync-run-20260913

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: sila/srcs-sync-run-20260913
          fetch-depth: 0

      - name: Regenerate exact latest Sila-native SRC content
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os, re, shutil, subprocess

          EXPECTED='84b46e7d69d08dbd8876503e435fd299211c26b8'
          V1_BLOB='2fcbefc9eec95f2aeacb376a0eecd27abd45002f'
          V2_BLOB='c20aed6c371bda8156fbd64d1f72166c4ce338f1'
          BRANCH='sila/srcs-sync-run-20260913'
          SOURCE='https://github.com/'+'ethe'+'reum/'+'ER'+'Cs.git'
          EXCLUDED={'Gemfile','Gemfile.lock','_config.yml'}

          def run(*args, cwd=None, capture=False):
              cp=subprocess.run(args,cwd=cwd,check=True,text=True,
                                stdout=subprocess.PIPE if capture else None,
                                stderr=subprocess.PIPE if capture else None)
              return cp.stdout if capture else None

          live=run('git','ls-remote',SOURCE,'refs/heads/master',capture=True).split()[0]
          print('LIVE_UPSTREAM='+live)
          if live != EXPECTED: raise SystemExit('UPSTREAM_AUTHORITY_MOVED:'+live)

          v1=run('git','hash-object','.sila/srcs_regenerate_v1.py',capture=True).strip()
          v2=run('git','hash-object','.sila/srcs_regenerate_v2.py',capture=True).strip()
          print('SRC_GENERATOR_V1_BLOB='+v1)
          print('SRC_GENERATOR_V2_BLOB='+v2)
          if v1 != V1_BLOB or v2 != V2_BLOB: raise SystemExit('SRC_GENERATOR_AUTHORITY_MISMATCH')
          compile(Path('.sila/srcs_regenerate_v2.py').read_text(encoding='utf-8'),'.sila/srcs_regenerate_v2.py','exec')

          shutil.rmtree('/tmp/src-source',ignore_errors=True)
          shutil.rmtree('/tmp/src-expected',ignore_errors=True)
          run('git','clone','--quiet',SOURCE,'/tmp/src-source')
          run('git','checkout','--quiet','--detach',EXPECTED,cwd='/tmp/src-source')
          run('python3','.sila/srcs_regenerate_v2.py','/tmp/src-source','/tmp/src-expected')

          current=Path('.').resolve(); expected=Path('/tmp/src-expected')
          def ignored(rel):
              return (rel=='.git' or rel.startswith('.git/') or rel=='.sila' or rel.startswith('.sila/') or
                      rel.startswith('.github/workflows/') or rel=='config' or rel.startswith('config/') or rel in EXCLUDED)

          expected_paths=set()
          for p in expected.rglob('*'):
              rel=p.relative_to(expected).as_posix()
              if not ignored(rel) and not p.is_dir(): expected_paths.add(rel)

          for p in sorted(current.rglob('*'), reverse=True):
              rel=p.relative_to(current).as_posix()
              if ignored(rel) or p.is_dir(): continue
              if rel not in expected_paths and (p.is_file() or p.is_symlink()): p.unlink()

          for rel in sorted(expected_paths):
              src=expected/rel; dst=current/rel
              dst.parent.mkdir(parents=True,exist_ok=True)
              if dst.exists() or dst.is_symlink():
                  if dst.is_dir(): shutil.rmtree(dst)
                  else: dst.unlink()
              if src.is_symlink(): os.symlink(os.readlink(src),dst)
              else: shutil.copy2(src,dst)

          def manifest(root):
              out={}
              for p in sorted(root.rglob('*')):
                  rel=p.relative_to(root).as_posix()
                  if ignored(rel): continue
                  if p.is_symlink(): out[rel]=('L',os.readlink(p))
                  elif p.is_file(): out[rel]=('F',hashlib.sha256(p.read_bytes()).hexdigest())
              return out

          a=manifest(current); b=manifest(expected)
          missing=sorted(set(b)-set(a)); extra=sorted(set(a)-set(b)); changed=sorted(k for k in set(a)&set(b) if a[k]!=b[k])
          print('SILA_AUTHORITY_MISSING_COUNT='+str(len(missing)))
          print('SILA_AUTHORITY_EXTRA_COUNT='+str(len(extra)))
          print('SILA_AUTHORITY_CHANGED_COUNT='+str(len(changed)))
          if missing or extra or changed: raise SystemExit('SILA_AUTHORITY_TREE_MISMATCH')

          required={'SRCS/src-20.md','SRCS/src-2535.md','SRCS/src-7730.md','SRCS/src-8187.md','SRCS/src-8354.md','SRCS/src-8377.md','_includes/sipnums.html','_includes/siptable.html','rss/nonsrc.xml','rss/nonsrc-last-call.xml','assets/src-1967/Sample-proxy-on-silascan.png'}
          absent=sorted(x for x in required if not (current/x).is_file())
          print('SILA_REQUIRED_PATH_MISSING_COUNT='+str(len(absent)))
          if absent: raise SystemExit('SILA_REQUIRED_PATH_GATE_FAILED')

          corruption=('wh'+'sila','soms'+'iling','togs'+'ila','tos'+'ilaer','nons'+'ileless')
          legacy=re.compile('(?i)('+'|'.join(('eip'+'nums','eip'+'table','sass-'+'eip','non'+'erc','ether'+'scan'))+')')
          policy_roots=[Path('Gemfile'),Path('Gemfile.lock'),Path('_config.yml'),Path('config'),Path('.github/workflows')]
          policy_bad=[]
          for base in policy_roots:
              paths=[base] if base.is_file() else (list(base.rglob('*')) if base.is_dir() else [])
              for p in paths:
                  if not p.is_file() or p.name=='srcs-authority-sync-temp.yml': continue
                  try: text=p.read_text(encoding='utf-8')
                  except UnicodeDecodeError: continue
                  for token in corruption:
                      if token in text: policy_bad.append(f'{p}:{token}')
                  if p.name!='sila-native-authority.yml' and legacy.search(text): policy_bad.append(f'{p}:legacy-compound')
          print('SILA_POLICY_RESIDUAL_COUNT='+str(len(policy_bad)))
          if policy_bad: raise SystemExit('SILA_POLICY_IDENTITY_GATE_FAILED')

          tracked=run('git','diff','--name-only',capture=True).splitlines()
          untracked=run('git','ls-files','--others','--exclude-standard',capture=True).splitlines()
          paths=sorted(set(tracked+untracked))
          print('SYNC_CHANGED_PATH_COUNT='+str(len(paths)))
          for rel in paths: run('git','add','-A','--',rel)
          run('git','diff','--cached','--check')
          run('git','config','user.name','github-actions[bot]')
          run('git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          run('git','commit','-m','sync: latest SRC content 84b46e7d')
          run('git','push','origin','HEAD:'+BRANCH)
          print('SRCS_LATEST_AUTHORITY_CONTENT_SYNC_GATE=PASS')
          PY
